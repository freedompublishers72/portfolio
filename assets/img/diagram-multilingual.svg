<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Multilingual Publishing Architecture</title>
<desc id="desc">Language URLs resolve directly to their language. English URLs use browser language automatically or remain English. From either location, visitors can optionally use a manual translation selector. The resolved language then determines translated content and query scope before WordPress delivers the page.</desc>
<defs>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#eaf4ff"/><stop offset="1" stop-color="#f6f9ff"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#edf9f3"/><stop offset="1" stop-color="#f7fcf9"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#f3efff"/><stop offset="1" stop-color="#faf8ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18304d" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#71839a"/></marker>
  <style>
    .title{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#102a43}.sub{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5b7088}.h{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#102a43}.b{font:400 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#536a82}.small{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#5d7490}.arrow{stroke:#71839a;stroke-width:2.2;fill:none}.dash{stroke:#8a7bd1;stroke-width:2;stroke-dasharray:7 6;fill:none}
  </style>
</defs>
<rect width="1400" height="560" fill="#fff"/>
<text x="70" y="58" class="title">Multilingual Publishing Architecture</text>
<text x="70" y="88" class="sub">Language-aware URLs, optional visitor selection, translated content and scoped WordPress queries.</text>
<rect x="70" y="125" width="355" height="300" rx="18" fill="url(#blue)" stroke="#c9ddf5" filter="url(#shadow)"/>
<text x="98" y="158" class="small">HOW THE LANGUAGE IS CHOSEN</text>
<rect x="98" y="180" width="299" height="62" rx="12" fill="#fff" stroke="#cbddec"/>
<circle cx="124" cy="211" r="15" fill="#2478df"/><text x="124" y="216" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="151" y="207" class="h">Language URL</text><text x="151" y="228" class="b">/zh/..., /km/..., etc. → that language</text>
<rect x="98" y="256" width="299" height="72" rx="12" fill="#fff" stroke="#cbddec"/>
<circle cx="124" cy="292" r="15" fill="#2478df"/><text x="124" y="297" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="151" y="283" class="h">English URL</text><text x="151" y="305" class="b">Browser language automatically</text><text x="151" y="323" class="b">or remain English</text>
<rect x="98" y="342" width="299" height="62" rx="12" fill="#fff" stroke="#cbddec"/>
<circle cx="124" cy="373" r="15" fill="#6d57d9"/><text x="124" y="378" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="151" y="369" class="h">Manual selector</text><text x="151" y="390" class="b">Optional visitor control from either URL</text>
<path d="M425 275H470" class="arrow" marker-end="url(#arrow)"/>
<rect x="470" y="190" width="235" height="170" rx="18" fill="url(#green)" stroke="#c9e9d7" filter="url(#shadow)"/>
<text x="495" y="222" class="small">ENGINE</text>
<text x="495" y="252" class="h">Resolved language</text>
<text x="495" y="279" class="b">The routing layer establishes</text><text x="495" y="300" class="b">the active language context.</text>
<rect x="495" y="319" width="185" height="23" rx="11" fill="#22a66a"/><text x="587" y="335" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#fff">LANGUAGE CONTEXT</text>
<path d="M705 275H750" class="arrow" marker-end="url(#arrow)"/>
<rect x="750" y="190" width="235" height="170" rx="18" fill="url(#green)" stroke="#c9e9d7" filter="url(#shadow)"/>
<text x="775" y="222" class="small">CONTENT</text>
<text x="775" y="252" class="h">Translated content</text>
<text x="775" y="279" class="b">Resolve the matching post/page</text><text x="775" y="300" class="b">for the active language.</text>
<text x="775" y="329" class="b">Native-language URLs are part</text><text x="775" y="348" class="b">of this routing system.</text>
<path d="M985 275H1030" class="arrow" marker-end="url(#arrow)"/>
<rect x="1030" y="190" width="235" height="170" rx="18" fill="url(#purple)" stroke="#ddd5fa" filter="url(#shadow)"/>
<text x="1055" y="222" class="small">QUERY</text>
<text x="1055" y="252" class="h">Query enforcement</text>
<text x="1055" y="279" class="b">Apply the active language to</text><text x="1055" y="300" class="b">posts, pages and listings.</text>
<text x="1055" y="329" class="b">Prevent cross-language</text><text x="1055" y="348" class="b">content leakage.</text>
<path d="M1265 275H1310" class="arrow" marker-end="url(#arrow)"/>
<rect x="1310" y="215" width="70" height="120" rx="16" fill="#102a43" filter="url(#shadow)"/>
<text x="1345" y="254" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">WP</text>
<text x="1345" y="278" text-anchor="middle" font-family="system-ui" font-size="12" fill="#dbe7f2">response</text>
<text x="1345" y="301" text-anchor="middle" font-family="system-ui" font-size="11" fill="#dbe7f2">localized</text>
<path d="M248 404V465H865V360" class="dash" marker-end="url(#arrow)"/>
<rect x="465" y="445" width="360" height="70" rx="14" fill="#faf9ff" stroke="#d8d0f7" stroke-dasharray="7 6"/>
<text x="490" y="473" class="h">GTranslate / manual translation selector</text>
<text x="490" y="496" class="b">Optional visitor control — secondary to the routing engine</text>
</svg>