<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Multilingual request pipeline</title>
<desc id="desc">An incoming language-prefixed request passes through language detection, locale resolution, translated-content resolution and query enforcement before reaching WordPress response handling.</desc>
<defs>
<style>
.t{font:600 20px system-ui,sans-serif;fill:#172033}.s{font:15px system-ui,sans-serif;fill:#5d6675}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eef5ff;stroke:#2563eb;stroke-width:2}.line{stroke:#64748b;stroke-width:2.5;fill:none}.pill{fill:#e8f0ff;stroke:#bfdbfe}.small{font:600 13px system-ui,sans-serif;fill:#2563eb;letter-spacing:.08em;text-transform:uppercase}
</style>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#64748b"/></marker>
</defs>
<rect width="1000" height="560" rx="24" fill="#f7f9fc"/>
<text x="60" y="58" class="small">REQUEST PIPELINE</text>
<text x="60" y="88" class="t">Resolve language before WordPress content is rendered</text>

<g>
<rect x="60" y="145" width="180" height="110" rx="16" class="box"/>
<text x="150" y="184" text-anchor="middle" class="t">Incoming request</text>
<text x="150" y="214" text-anchor="middle" class="s">/lang/path/</text>
<rect x="100" y="230" width="100" height="20" rx="10" class="pill"/>
<text x="150" y="244" text-anchor="middle" class="small" style="font-size:11px">PREFIX</text>
</g>
<path d="M240 200h45" class="line" marker-end="url(#a)"/>

<rect x="285" y="145" width="180" height="110" rx="16" class="accent"/>
<text x="375" y="180" text-anchor="middle" class="t">Language / locale</text>
<text x="375" y="206" text-anchor="middle" class="t">resolution</text>
<text x="375" y="232" text-anchor="middle" class="s">prefix + fallback rules</text>
<path d="M465 200h45" class="line" marker-end="url(#a)"/>

<rect x="510" y="145" width="190" height="110" rx="16" class="box"/>
<text x="605" y="180" text-anchor="middle" class="t">Translated content</text>
<text x="605" y="206" text-anchor="middle" class="t">resolution</text>
<text x="605" y="232" text-anchor="middle" class="s">controlled translation rules</text>
<path d="M700 200h45" class="line" marker-end="url(#a)"/>

<rect x="745" y="145" width="195" height="110" rx="16" class="box"/>
<text x="842" y="180" text-anchor="middle" class="t">Query enforcement</text>
<text x="842" y="208" text-anchor="middle" class="s">language-scoped</text>
<text x="842" y="232" text-anchor="middle" class="s">WordPress queries</text>

<path d="M842 255v72" class="line" marker-end="url(#a)"/>
<rect x="650" y="327" width="290" height="110" rx="16" class="accent"/>
<text x="795" y="365" text-anchor="middle" class="t">WordPress response</text>
<text x="795" y="393" text-anchor="middle" class="s">native-language slugs supported</text>
<text x="795" y="416" text-anchor="middle" class="s">content rendered in resolved lane</text>

<path d="M650 382H470" class="line" marker-end="url(#a)"/>
<rect x="60" y="327" width="410" height="110" rx="16" class="box"/>
<text x="265" y="365" text-anchor="middle" class="t">The important boundary</text>
<text x="265" y="393" text-anchor="middle" class="s">routing, translation resolution and query</text>
<text x="265" y="416" text-anchor="middle" class="s">scoping are explicit, testable stages</text>

<text x="60" y="505" class="s">The diagram shows the public architectural pattern, not the private production implementation.</text>
</svg>