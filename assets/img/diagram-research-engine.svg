<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">Framework-independent research and data engine</title>
<desc id="desc">External data sources feed source-specific acquisition adapters into normalization, persistence, analysis and research outputs. An external orchestration layer schedules the engine. WordPress consumes outputs through a thin REST boundary.</desc>
<defs>
<style>
.t{font:600 18px system-ui,sans-serif;fill:#172033}.s{font:15px system-ui,sans-serif;fill:#5d6675}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eef5ff;stroke:#2563eb;stroke-width:2}.green{fill:#eefbf4;stroke:#16a34a;stroke-width:2}.line{stroke:#64748b;stroke-width:2.5;fill:none}.small{font:600 13px system-ui,sans-serif;fill:#2563eb;letter-spacing:.08em}
</style>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#64748b"/></marker>
</defs>
<rect width="1000" height="610" rx="24" fill="#f7f9fc"/>
<text x="55" y="48" class="small">ENGINE ARCHITECTURE</text>
<text x="55" y="78" class="t">Framework-independent core, thin presentation boundary</text>

<rect x="55" y="120" width="180" height="90" rx="16" class="box"/>
<text x="145" y="155" text-anchor="middle" class="t">External data</text>
<text x="145" y="181" text-anchor="middle" class="s">multiple sources</text>

<rect x="275" y="105" width="190" height="120" rx="16" class="blue"/>
<text x="370" y="142" text-anchor="middle" class="t">Acquisition</text>
<text x="370" y="168" text-anchor="middle" class="s">source adapters</text>
<text x="370" y="193" text-anchor="middle" class="s">shared provider contract</text>

<path d="M235 165h40" class="line" marker-end="url(#a)"/><path d="M465 165h40" class="line" marker-end="url(#a)"/>

<rect x="515" y="105" width="180" height="120" rx="16" class="box"/>
<text x="605" y="142" text-anchor="middle" class="t">Normalization</text>
<text x="605" y="168" text-anchor="middle" class="s">canonical observations</text>
<text x="605" y="193" text-anchor="middle" class="s">source-native evidence</text>

<path d="M695 165h40" class="line" marker-end="url(#a)"/>
<rect x="745" y="105" width="200" height="120" rx="16" class="box"/>
<text x="845" y="142" text-anchor="middle" class="t">Persistence</text>
<text x="845" y="168" text-anchor="middle" class="s">canonical stores</text>
<text x="845" y="193" text-anchor="middle" class="s">ingestion catalog + migrations</text>

<path d="M845 225v55" class="line" marker-end="url(#a)"/>
<rect x="625" y="280" width="320" height="120" rx="16" class="green"/>
<text x="785" y="318" text-anchor="middle" class="t">Analysis / evaluation</text>
<text x="785" y="345" text-anchor="middle" class="s">valuation · recommendation</text>
<text x="785" y="372" text-anchor="middle" class="s">Brier self-scoring</text>

<path d="M625 340H465" class="line" marker-end="url(#a)"/>
<rect x="235" y="280" width="230" height="120" rx="16" class="box"/>
<text x="350" y="318" text-anchor="middle" class="t">Research outputs</text>
<text x="350" y="345" text-anchor="middle" class="s">structured results</text>
<text x="350" y="372" text-anchor="middle" class="s">private drafts for review</text>

<rect x="55" y="280" width="140" height="120" rx="16" class="blue"/>
<text x="125" y="318" text-anchor="middle" class="t">REST</text>
<text x="125" y="345" text-anchor="middle" class="s">thin boundary</text>
<text x="125" y="372" text-anchor="middle" class="s">to clients</text>
<path d="M195 340h40" class="line" marker-end="url(#a)"/>

<rect x="55" y="445" width="250" height="95" rx="16" class="box"/>
<text x="180" y="480" text-anchor="middle" class="t">WordPress</text>
<text x="180" y="506" text-anchor="middle" class="s">presentation + admin views</text>
<text x="180" y="528" text-anchor="middle" class="s">client, not engine dependency</text>

<rect x="345" y="445" width="250" height="95" rx="16" class="box"/>
<text x="470" y="480" text-anchor="middle" class="t">External orchestration</text>
<text x="470" y="506" text-anchor="middle" class="s">cron · cadence · registry</text>
<text x="470" y="528" text-anchor="middle" class="s">watchdog / health</text>

<path d="M470 445V400" class="line" marker-end="url(#a)"/>
<path d="M305 492h40" class="line" marker-end="url(#a)"/>

<text x="625" y="500" class="s">Scheduling lives outside the engine.</text>
<text x="625" y="525" class="s">The core can run without WordPress.</text>
</svg>