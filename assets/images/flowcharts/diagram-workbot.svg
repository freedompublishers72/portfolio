<svg viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="800" fill="#f6f1e7"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#152b43}
.title{font-size:58px;font-weight:700}.subtitle{font-size:28px;fill:#4c6272}.heading{font-size:25px;font-weight:700}.body{font-size:22px}.small{font-size:20px}.box{fill:#f2eadc;stroke:#827867;stroke-width:3}.key{fill:#e9f0f4;stroke:#152b43;stroke-width:4}.band{fill:#f2eadc;stroke:#827867;stroke-width:3}.arrow{fill:none;stroke:#152b43;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#4c6272;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}.label{font-size:18px;font-weight:700;letter-spacing:3px;fill:#4c6272}
