<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 390" role="img" aria-labelledby="travel-title travel-desc" xmlns="http://www.w3.org/2000/svg">
<style>
svg{color:#151719;font-family:Helvetica Neue,Avenir Next,Segoe UI,Arial,sans-serif}
.box,.note{fill:#f2ede3;stroke:#c8c0b3;stroke-width:1.5}
.key{fill:#faf7ef;stroke:#152b43;stroke-width:1.8}
.flow{fill:none;stroke:#152b43;stroke-width:1.7}
.dash{fill:none;stroke:#4c6272;stroke-width:1.4;stroke-dasharray:5 4}
.label{fill:#4c6272;font-size:11px;font-weight:700;letter-spacing:.1em}
.small{fill:#4c6272;font-size:11px}
text{fill:#151719;font-size:14px}
</style>
<title id="travel-title">Travel Bonanza architecture</title>
<desc id="travel-desc">Scheduled Viator acquisition feeds a local catalogue. The website and email sequence read the local catalogue without calling Viator during customer delivery.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<text x="20" y="28" class="label">TRAVEL BONANZA</text>
<g class="box"><rect x="20" y="78" width="170" height="78" rx="8"/><text x="105" y="108" text-anchor="middle">Scheduled</text><text x="105" y="129" text-anchor="middle">provider acquisition</text></g>
<path class="flow" d="M190 117H270" marker-end="url(#a)"/>
<g class="key"><rect x="270" y="58" width="220" height="118" rx="8"/><text x="380" y="91" text-anchor="middle">Local catalogue</text><text x="380" y="116" text-anchor="middle" class="small">products · pricing · ratings</text><text x="380" y="137" text-anchor="middle" class="small">referrals · selections</text></g>
<path class="flow" d="M490 117H550" marker-end="url(#a)"/>
<g class="box"><rect x="550" y="48" width="190" height="68" rx="8"/><text x="645" y="76" text-anchor="middle">Website</text><text x="645" y="97" text-anchor="middle" class="small">recommendations</text></g>
<path class="dash" d="M490 145H525V222H550" marker-end="url(#a)"/>
<g class="box"><rect x="550" y="190" width="190" height="68" rx="8"/><text x="645" y="218" text-anchor="middle">Email sequence</text><text x="645" y="239" text-anchor="middle" class="small">stored selections</text></g>
<g class="note"><rect x="90" y="285" width="580" height="68" rx="10"/><text x="115" y="312" class="label">DELIVERY BOUNDARY</text><text x="115" y="336">Customer delivery reads the local catalogue. Viator is isolated to acquisition.</text></g>
</svg>