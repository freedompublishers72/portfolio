<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 390" role="img"
aria-labelledby="research-rde-diagram-title research-rde-diagram-desc"
xmlns="http://www.w3.org/2000/svg">
<style>
svg { color: #151719; font-family: 'Helvetica Neue', 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
.diagram-box rect, .diagram-note rect, .diagram-boundary { fill: #f2ede3; stroke: #c8c0b3; stroke-width: 1.5; }
.diagram-key rect, .diagram-key .diagram-decision { fill: #faf7ef; stroke: #152b43; stroke-width: 1.8; }
.diagram-decision { fill: #faf7ef; stroke: #c8c0b3; stroke-width: 1.5; }
.diagram-flow { fill: none; stroke: #152b43; stroke-width: 1.7; }
.diagram-dash { fill: none; stroke: #4c6272; stroke-width: 1.4; stroke-dasharray: 5 4; }
.diagram-label { fill: #4c6272; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
.diagram-small { fill: #4c6272; font-size: 11px; }
.diagram-box text { font-size: 14px; }
</style>

<title id="research-rde-diagram-title">Research and data engine architecture</title>
<desc id="research-rde-diagram-desc">External sources feed source adapters inside a
framework-independent engine. Data is normalized, persisted and analyzed before crossing a REST
boundary to WordPress. Scheduling remains external.</desc>
<defs>
<marker id="research-rde-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
markerHeight="7" orient="auto">
<path d="M0 0L10 5 0 10z" fill="currentColor" />
</marker>
</defs>
<g font-family="inherit" fill="currentColor"><text x="20" y="28"
class="diagram-label">FRAMEWORK-INDEPENDENT DATA FLOW</text>
<g class="diagram-note">
<rect x="20" y="58" width="150" height="80" rx="8" /><text x="95" y="84"
text-anchor="middle">External</text><text x="95" y="104"
text-anchor="middle">sources</text><text x="95" y="124" text-anchor="middle"
class="diagram-small">APIs / feeds</text>
</g>
<path class="diagram-flow" d="M170 98H205" marker-end="url(#rde-arrow)" />
<rect x="205" y="42" width="470" height="245" rx="12" class="diagram-boundary" /><text x="225"
y="68" class="diagram-label">ENGINE BOUNDARY</text>
<g class="diagram-box">
<rect x="225" y="88" width="120" height="64" rx="8" /><text x="285" y="114"
text-anchor="middle">Adapters</text><text x="285" y="134" text-anchor="middle"
class="diagram-small">shared contract</text>
</g>
<path class="diagram-flow" d="M345 120H370" marker-end="url(#rde-arrow)" />
<g class="diagram-box">
<rect x="370" y="88" width="120" height="64" rx="8" /><text x="430" y="114"
text-anchor="middle">Normalize</text><text x="430" y="134" text-anchor="middle"
class="diagram-small">canonical form</text>
</g>
<path class="diagram-flow" d="M490 120H515" marker-end="url(#rde-arrow)" />
<g class="diagram-box">
<rect x="515" y="88" width="140" height="64" rx="8" /><text x="585" y="114"
text-anchor="middle">Persist</text><text x="585" y="134" text-anchor="middle"
class="diagram-small">source + catalog</text>
</g>
<path class="diagram-flow" d="M585 152V190" marker-end="url(#rde-arrow)" />
<g class="diagram-box diagram-key">
<rect x="370" y="190" width="200" height="64" rx="8" /><text x="470" y="216"
text-anchor="middle">Analyze + evaluate</text><text x="470" y="236" text-anchor="middle"
class="diagram-small">research + accuracy scoring</text>
</g>
<path class="diagram-flow" d="M370 222H345" marker-end="url(#rde-arrow)" />
<path class="diagram-flow" d="M345 222H695" marker-end="url(#rde-arrow)" />
<g class="diagram-box">
<rect x="575" y="305" width="165" height="58" rx="8" /><text x="657" y="329"
text-anchor="middle">WordPress client</text><text x="657" y="348" text-anchor="middle"
class="diagram-small">REST presentation</text>
</g>
<path class="diagram-flow" d="M570 254L657 305" marker-end="url(#rde-arrow)" />
<g class="diagram-note">
<rect x="20" y="190" width="300" height="173" rx="8" /><text x="42" y="217"
class="diagram-label">OUTSIDE THE ENGINE</text><text x="42" y="242">Scheduler / cadence /
watchdog</text><text x="42" y="266">invokes collection but does not</text><text x="42"
y="286">become part of the research core.</text><text x="42" y="321">WordPress is a client,
not a dependency.</text><text x="42" y="345">REST is the boundary.</text>
</g>
</g>
</svg>
