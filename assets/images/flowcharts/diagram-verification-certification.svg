<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 390" role="img"
aria-labelledby="verify-vc-diagram-title verify-vc-diagram-desc" xmlns="http://www.w3.org/2000/svg">
<style>
svg { color: #151719; font-family: 'Helvetica Neue', 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
.diagram-box rect, .diagram-note rect, .diagram-boundary { fill: #f2ede3; stroke: #c8c0b3; stroke-width: 1.5; }
.diagram-key rect, .diagram-key .diagram-decision { fill: #faf7ef; stroke: #152b43; stroke-width: 1.8; }
.diagram-decision { fill: #faf7ef; stroke: #c8c0b3; stroke-width: 1.5; }
.diagram-flow { fill: none; stroke: #152b43; stroke-width: 1.7; }
.diagram-dash { fill: none; stroke: #4c6272; stroke-width: 1.4; stroke-dasharray: 5 4; }
.diagram-label { fill: #4c6272; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
.diagram-small { fill: #4c6272; font-size: 11px; }
.diagram-box text { font-size: 14px; }
</style>

<title id="verify-vc-diagram-title">Verification and certification lifecycle</title>
<desc id="verify-vc-diagram-desc">Authorized work moves through implementation, focused testing,
runtime verification and independent audit to a certification gate. Certification, remediation and
deferral are distinct outcomes.</desc>
<defs>
<marker id="verify-vc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
markerHeight="7" orient="auto">
<path d="M0 0L10 5 0 10z" fill="currentColor" />
</marker>
</defs>
<g font-family="inherit" fill="currentColor"><text x="20" y="28"
class="diagram-label">EVIDENCE-BASED DELIVERY</text>
<g class="diagram-box">
<rect x="20" y="62" width="135" height="62" rx="8" /><text x="87" y="88"
text-anchor="middle">Scope</text><text x="87" y="108" text-anchor="middle"
class="diagram-small">requirements</text>
</g>
<path class="diagram-flow" d="M155 93H185" marker-end="url(#vc-arrow)" />
<g class="diagram-box">
<rect x="185" y="62" width="135" height="62" rx="8" /><text x="252" y="88"
text-anchor="middle">Implement</text><text x="252" y="108" text-anchor="middle"
class="diagram-small">authorized change</text>
</g>
<path class="diagram-flow" d="M320 93H350" marker-end="url(#vc-arrow)" />
<g class="diagram-box">
<rect x="350" y="62" width="145" height="62" rx="8" /><text x="422" y="88"
text-anchor="middle">Verify</text><text x="422" y="108" text-anchor="middle"
class="diagram-small">tests + runtime</text>
</g>
<path class="diagram-flow" d="M495 93H525" marker-end="url(#vc-arrow)" />
<g class="diagram-box">
<rect x="525" y="62" width="145" height="62" rx="8" /><text x="597" y="88"
text-anchor="middle">Independent</text><text x="597" y="108" text-anchor="middle"
class="diagram-small">audit</text>
</g>
<path class="diagram-flow" d="M670 93H710" marker-end="url(#vc-arrow)" />
<g class="diagram-key">
<path class="diagram-decision" d="M710 55L755 93 710 131 665 93z" /><text x="710" y="90"
text-anchor="middle">Gate</text><text x="710" y="107" text-anchor="middle"
class="diagram-small">evidence</text>
</g>
<g class="diagram-note">
<rect x="170" y="190" width="500" height="155" rx="12" /><text x="195" y="218"
class="diagram-label">THREE LEGITIMATE OUTCOMES</text>
<g class="diagram-box">
<rect x="195" y="240" width="130" height="58" rx="8" /><text x="260" y="274"
text-anchor="middle">CERTIFIED</text>
</g>
<g class="diagram-box">
<rect x="350" y="240" width="130" height="58" rx="8" /><text x="415" y="274"
text-anchor="middle">REMEDIATE</text>
</g>
<g class="diagram-box">
<rect x="505" y="240" width="130" height="58" rx="8" /><text x="570" y="274"
text-anchor="middle">DEFER</text>
</g><text x="195" y="326" class="diagram-small">Remediation and deferral return to controlled
work; neither is silently treated as a pass.</text>
</g>
<path class="diagram-dash" d="M415 298V365H252V124" marker-end="url(#vc-arrow)" />
<path class="diagram-dash" d="M570 298V365H252" />
</g>
</svg>
