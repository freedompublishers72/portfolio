<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 390" role="img" aria-labelledby="multi-title multi-desc" xmlns="http://www.w3.org/2000/svg">
<style>
svg{color:#151719;font-family:Helvetica Neue,Avenir Next,Segoe UI,Arial,sans-serif}
.box,.note{fill:#f2ede3;stroke:#c8c0b3;stroke-width:1.5}
.key{fill:#faf7ef;stroke:#152b43;stroke-width:1.8}
.flow{fill:none;stroke:#152b43;stroke-width:1.7}
.dash{fill:none;stroke:#4c6272;stroke-width:1.4;stroke-dasharray:5 4}
.label{fill:#4c6272;font-size:11px;font-weight:700;letter-spacing:.1em}
.small{fill:#4c6272;font-size:11px}
text{fill:#151719;font-size:14px}
</style>
<title id="multi-title">Multilingual publishing flow</title>
<desc id="multi-desc">A language-aware URL is resolved into a selected language, which determines the translated content and query scope delivered by WordPress.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<text x="20" y="28" class="label">MULTILINGUAL PUBLISHING</text>
<g class="box"><rect x="20" y="70" width="150" height="68" rx="8"/><text x="95" y="98" text-anchor="middle">Language-aware</text><text x="95" y="118" text-anchor="middle" class="small">URL</text></g>
<path class="flow" d="M170 104H210" marker-end="url(#a)"/>
<g class="key"><rect x="210" y="55" width="175" height="98" rx="8"/><text x="297" y="86" text-anchor="middle">Resolve language</text><text x="297" y="108" text-anchor="middle" class="small">browser language</text><text x="297" y="127" text-anchor="middle" class="small">or manual selection</text></g>
<path class="flow" d="M385 104H425" marker-end="url(#a)"/>
<g class="box"><rect x="425" y="70" width="150" height="68" rx="8"/><text x="500" y="98" text-anchor="middle">Select content</text><text x="500" y="118" text-anchor="middle" class="small">translation + scope</text></g>
<path class="flow" d="M575 104H615" marker-end="url(#a)"/>
<g class="key"><rect x="615" y="70" width="125" height="68" rx="8"/><text x="677" y="98" text-anchor="middle">WordPress</text><text x="677" y="118" text-anchor="middle" class="small">delivery</text></g>
<g class="note"><rect x="115" y="205" width="530" height="105" rx="10"/><text x="140" y="234" class="label">PUBLISHING SIDE</text><text x="140" y="263">Translation updates are stored as permanent</text><text x="140" y="284">language-specific content artifacts, so delivery</text><text x="140" y="305">does not depend on live translation at request time.</text></g>
<path class="dash" d="M500 138V205" marker-end="url(#a)"/>
</svg>