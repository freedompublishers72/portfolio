<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 390" role="img" aria-labelledby="resilient-title resilient-desc" xmlns="http://www.w3.org/2000/svg">
<style>
svg{color:#151719;font-family:Helvetica Neue,Avenir Next,Segoe UI,Arial,sans-serif}
.box,.band{fill:#f2ede3;stroke:#8d8374;stroke-width:1.5}
.key{fill:#eef2f3;stroke:#152b43;stroke-width:1.8}
.flow{fill:none;stroke:#152b43;stroke-width:1.7}
.dash{fill:none;stroke:#4c6272;stroke-width:1.3;stroke-dasharray:4 4}
.h{fill:#152b43;font-size:15px;font-weight:700;letter-spacing:.02em}
.s{fill:#151719;font-size:12px}
.label{fill:#4c6272;font-size:10px;font-weight:700;letter-spacing:.12em}
</style>
<title id="resilient-title">Resilient Collection Primitives</title>
<desc id="resilient-desc">Composable collection components for dependable data acquisition, failure handling, persistence, recovery, and verification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#152b43"/></marker></defs>

<text x="24" y="28" class="h" font-size="21">Resilient Collection Primitives</text>
<text x="24" y="46" class="s">Composable components for dependable large-scale data collection and research.</text>

<g class="box">
 <rect x="24" y="72" width="140" height="62" rx="8"/>
 <text x="94" y="96" text-anchor="middle" class="h">TARGET SOURCES</text>
 <text x="94" y="117" text-anchor="middle" class="s">APIs · sites · feeds · files</text>
</g>
<path class="flow" d="M164 103H190" marker-end="url(#arrow)"/>

<g class="key">
 <rect x="190" y="64" width="190" height="78" rx="8"/>
 <text x="285" y="91" text-anchor="middle" class="h">COLLECTION ENGINE</text>
 <text x="285" y="113" text-anchor="middle" class="s">Scheduling · fetching · parsing</text>
 <text x="285" y="130" text-anchor="middle" class="s">Normalization · pacing</text>
</g>
<path class="flow" d="M380 103H406" marker-end="url(#arrow)"/>

<g class="box">
 <rect x="406" y="72" width="145" height="62" rx="8"/>
 <text x="478" y="96" text-anchor="middle" class="h">STORAGE LAYER</text>
 <text x="478" y="117" text-anchor="middle" class="s">Raw · parsed · enriched</text>
</g>
<path class="flow" d="M551 103H576" marker-end="url(#arrow)"/>

<g class="box">
 <rect x="576" y="72" width="160" height="62" rx="8"/>
 <text x="656" y="96" text-anchor="middle" class="h">PROCESS</text>
 <text x="656" y="117" text-anchor="middle" class="s">Analysis · rules · verification</text>
</g>

<path class="flow" d="M285 142V164" marker-end="url(#arrow)"/>
<path class="dash" d="M478 134V164" marker-end="url(#arrow)"/>
<path class="flow" d="M656 134V164" marker-end="url(#arrow)"/>

<g class="band">
 <rect x="72" y="164" width="560" height="62" rx="10"/>
 <text x="352" y="188" text-anchor="middle" class="h">RESILIENCE PRIMITIVES</text>
 <text x="352" y="209" text-anchor="middle" class="s">Retry · backoff · error handling · checkpointing · idempotency · monitoring</text>
</g>
<path class="flow" d="M632 195H652" marker-end="url(#arrow)"/>

<g class="box">
 <rect x="652" y="164" width="84" height="62" rx="8"/>
 <text x="694" y="188" text-anchor="middle" class="h" font-size="12">OUTPUTS</text>
 <text x="694" y="209" text-anchor="middle" class="s" font-size="10">DB · files · APIs</text>
</g>

<g class="band">
 <rect x="24" y="252" width="712" height="58" rx="10"/>
 <text x="380" y="276" text-anchor="middle" class="h">RECOVERY BOUNDARY</text>
 <text x="380" y="297" text-anchor="middle" class="s">Failures remain explicit; persisted partial results remain available for recovery and verification.</text>
</g>

<g class="band">
 <rect x="24" y="330" width="712" height="42" rx="10"/>
 <text x="380" y="347" text-anchor="middle" class="label">REUSABLE COMPONENTS</text>
 <text x="380" y="364" text-anchor="middle" class="s">Collectors · parsers · transformers · validators · schedulers · storage adapters · notification hooks</text>
</g>
</svg>